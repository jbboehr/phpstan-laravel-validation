name: ci

on:
    push:
        branches:
            - master
            - develop
            - ci
    pull_request:
        branches:
            - master

permissions:
    contents: read

jobs:
    lint:
        runs-on: ubuntu-latest
        name: "Lint | PHP ${{ matrix.php-version }}"
        strategy:
            fail-fast: false
            matrix:
                php-version:
                    - "8.1"
                    - "8.2"
                    - "8.3"
                    - "8.4"
                    - "8.5"
        steps:
            - uses: actions/checkout@v7

            - name: Install PHP
              uses: shivammathur/setup-php@v2
              with:
                  coverage: "none"
                  php-version: "${{ matrix.php-version }}"
                  tools: composer:v2

            - name: Validate composer.json and composer.lock
              run: composer validate --strict

            - name: Cache Composer packages
              id: composer-cache
              uses: actions/cache@v6
              with:
                  path: vendor
                  key: ${{ runner.os }}-php-${{ matrix.php-version }}-${{ hashFiles('**/composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-php-${{ matrix.php-version }}-

            - name: Install dependencies
              run: composer install --prefer-dist --no-progress --ignore-platform-req=php+

            - name: PHP-CS-Fixer
              run: composer cs

            - name: phpstan
              run: php vendor/bin/phpstan analyze

    minimum-phpstan:
        runs-on: ubuntu-latest
        name: "Minimum PHPStan | PHP 8.1 | PHPStan 2.1.5"
        steps:
            - uses: actions/checkout@v7

            - name: Install PHP
              uses: shivammathur/setup-php@v2
              with:
                  coverage: "none"
                  php-version: "8.1"
                  tools: composer:v2

            - name: Install minimum supported PHPStan
              run: >-
                  composer update
                  phpstan/phpstan
                  phpstan/phpstan-phpunit
                  phpstan/phpstan-strict-rules
                  --with phpstan/phpstan:2.1.5
                  --with-all-dependencies
                  --prefer-dist
                  --no-interaction
                  --no-progress

            - name: phpstan
              run: php vendor/bin/phpstan analyze

            - name: Run test suite
              run: php vendor/bin/phpunit

    test:
        runs-on: ubuntu-latest
        name: "Test | PHP ${{ matrix.php-version }} | Laravel ${{ matrix.laravel-profile }}"
        strategy:
            fail-fast: false
            matrix:
                php-version:
                    - "8.1"
                    - "8.2"
                    - "8.3"
                    - "8.4"
                    - "8.5"
                laravel-profile:
                    - "10.0.0"
                    - "10.32.1"
                    - "10.33.0"
                    - "10-latest"
                    - "11.0.0"
                    - "11-latest"
                    - "12.0.0"
                    - "12.21.0"
                    - "12.22.0"
                    - "12-latest"
                    - "13.0.0"
                    - "13.3.0"
                    - "13.4.0"
                    - "13-latest"
                include:
                    - laravel-profile: "10.0.0"
                      laravel-constraint: "10.0.0"
                    - laravel-profile: "10.32.1"
                      laravel-constraint: "10.32.1"
                    - laravel-profile: "10.33.0"
                      laravel-constraint: "10.33.0"
                    - laravel-profile: "10-latest"
                      laravel-constraint: "^10.0"
                    - laravel-profile: "11.0.0"
                      laravel-constraint: "11.0.0"
                    - laravel-profile: "11-latest"
                      laravel-constraint: "^11.0"
                    - laravel-profile: "12.0.0"
                      laravel-constraint: "12.0.0"
                    - laravel-profile: "12.21.0"
                      laravel-constraint: "12.21.0"
                    - laravel-profile: "12.22.0"
                      laravel-constraint: "12.22.0"
                    - laravel-profile: "12-latest"
                      laravel-constraint: "^12.0"
                    - laravel-profile: "13.0.0"
                      laravel-constraint: "13.0.0"
                    - laravel-profile: "13.3.0"
                      laravel-constraint: "13.3.0"
                    - laravel-profile: "13.4.0"
                      laravel-constraint: "13.4.0"
                    - laravel-profile: "13-latest"
                      laravel-constraint: "^13.0"
                exclude:
                    # Laravel 11 and 12 require PHP ^8.2
                    - php-version: "8.1"
                      laravel-profile: "11.0.0"
                    - php-version: "8.1"
                      laravel-profile: "11-latest"
                    - php-version: "8.1"
                      laravel-profile: "12.0.0"
                    - php-version: "8.1"
                      laravel-profile: "12.21.0"
                    - php-version: "8.1"
                      laravel-profile: "12.22.0"
                    - php-version: "8.1"
                      laravel-profile: "12-latest"
                    # Laravel 13 requires PHP ^8.3
                    - php-version: "8.1"
                      laravel-profile: "13.0.0"
                    - php-version: "8.2"
                      laravel-profile: "13.0.0"
                    - php-version: "8.1"
                      laravel-profile: "13.3.0"
                    - php-version: "8.2"
                      laravel-profile: "13.3.0"
                    - php-version: "8.1"
                      laravel-profile: "13.4.0"
                    - php-version: "8.2"
                      laravel-profile: "13.4.0"
                    - php-version: "8.1"
                      laravel-profile: "13-latest"
                    - php-version: "8.2"
                      laravel-profile: "13-latest"
        steps:
            - uses: actions/checkout@v7

            - name: Install PHP
              uses: shivammathur/setup-php@v2
              with:
                  coverage: "none"
                  php-version: "${{ matrix.php-version }}"
                  tools: composer:v2

            - name: Cache Composer packages
              id: composer-cache
              uses: actions/cache@v6
              with:
                  path: vendor
                  key: ${{ runner.os }}-php-${{ matrix.php-version }}-laravel-${{ matrix.laravel-profile }}-${{ hashFiles('**/composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-php-${{ matrix.php-version }}-laravel-${{ matrix.laravel-profile }}-

            - name: Install dependencies
              run: composer install --prefer-dist --no-progress --ignore-platform-req=php+

            - name: Install laravel
              run: composer require --prefer-dist --no-progress --with-all-dependencies --dev --ignore-platform-req=php+ --no-blocking laravel/framework:${{ matrix.laravel-constraint }}

            - name: Run test suite
              env:
                  LARAVEL_AUDIT_BASELINE: ${{ matrix.laravel-profile }}
              run: php vendor/bin/phpunit

    coverage:
        runs-on: ubuntu-latest
        name: "Coverage | PHP ${{ matrix.php-version }}"
        strategy:
            matrix:
                php-version:
                    - "8.5"
        steps:
            - uses: actions/checkout@v7

            - name: Install PHP
              uses: shivammathur/setup-php@v2
              with:
                  coverage: pcov
                  php-version: "${{ matrix.php-version }}"
                  tools: composer:v2

            - name: Cache Composer packages
              id: composer-cache
              uses: actions/cache@v6
              with:
                  path: vendor
                  key: ${{ runner.os }}-php-${{ matrix.php-version }}-${{ hashFiles('**/composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-php-${{ matrix.php-version }}-

            - name: Install dependencies
              run: composer install --prefer-dist --no-progress

            - name: Run test suite with coverage
              run: >-
                  php vendor/bin/phpunit
                  --coverage-clover clover.xml
                  --coverage-text
                  --show-uncovered-for-coverage-text
                  --only-summary-for-coverage-text

            # Code Climate disabled its coverage API in July 2025. Keep this
            # disabled until coverage reporting is migrated to Qlty.
            # - name: Upload code coverage
            #   uses: paambaati/codeclimate-action@v9.0.0
            #   env:
            #       CC_TEST_REPORTER_ID: 3f8f6d064fc0b063230c71511f07aec326a2eb84f3c5653161b5f087aae315f9
            #   with:
            #       coverageCommand: "true"
            #       coverageLocations: |
            #           clover.xml:clover

    infection:
        runs-on: ubuntu-latest
        name: "Mutation testing | PHP 8.5"
        steps:
            - uses: actions/checkout@v7

            - name: Install PHP
              uses: shivammathur/setup-php@v2
              with:
                  coverage: pcov
                  php-version: "8.5"
                  tools: composer:v2

            - name: Cache Composer packages
              uses: actions/cache@v6
              with:
                  path: |
                      vendor
                      tools/infection/vendor
                  key: ${{ runner.os }}-php-8.5-infection-${{ hashFiles('composer.lock', 'tools/infection/composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-php-8.5-infection-

            - name: Install project dependencies
              run: composer install --prefer-dist --no-progress

            - name: Install Infection
              run: composer --working-dir=tools/infection install --prefer-dist --no-progress

            - name: Run mutation tests
              env:
                  COMPOSER_PROCESS_TIMEOUT: 1800
              run: composer infection -- --logger-github=false

    larastan:
        runs-on: ubuntu-latest
        name: "Larastan compatibility | PHP 8.5 | Laravel 13"
        steps:
            - uses: actions/checkout@v7

            - name: Install PHP
              uses: shivammathur/setup-php@v2
              with:
                  coverage: "none"
                  php-version: "8.5"
                  tools: composer:v2

            - name: Cache Composer packages
              id: composer-cache
              uses: actions/cache@v6
              with:
                  path: vendor
                  key: ${{ runner.os }}-php-8.5-larastan-${{ hashFiles('**/composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-php-8.5-larastan-

            - name: Install dependencies
              run: composer install --prefer-dist --no-progress --ignore-platform-req=php+

            - name: Install Larastan and Laravel
              run: >-
                  composer require
                  --prefer-dist
                  --no-progress
                  --with-all-dependencies
                  --dev
                  --ignore-platform-req=php+
                  --no-blocking
                  larastan/larastan:^3.0
                  laravel/framework:^13.0

            - name: Run Larastan compatibility tests
              run: php vendor/bin/phpunit --group larastan --fail-on-skipped

    nix:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: cachix/install-nix-action@v31
              with:
                  nix_path: nixpkgs=channel:nixos-26.05

#            - run: nix build -L

            - run: nix flake check -L
