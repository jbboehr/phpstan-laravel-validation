name: ci

on:
    push:
        branches:
            - master
            - develop
            - ci
    pull_request:
        branches:
            - master

permissions:
    contents: read

jobs:
    lint:
        runs-on: ubuntu-latest
        name: "Lint | PHP ${{ matrix.php-version }}"
        strategy:
            fail-fast: false
            matrix:
                php-version:
                    - "8.1"
                    - "8.2"
                    - "8.3"
                    - "8.4"
                    - "8.5"
        steps:
            - uses: actions/checkout@v7

            - name: Install PHP
              uses: shivammathur/setup-php@v2
              with:
                  coverage: "none"
                  php-version: "${{ matrix.php-version }}"
                  tools: composer:v2

            - name: Validate composer.json and composer.lock
              run: composer validate --strict

            - name: Cache Composer packages
              id: composer-cache
              uses: actions/cache@v6
              with:
                  path: vendor
                  key: ${{ runner.os }}-php-${{ matrix.php-version }}-${{ hashFiles('**/composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-php-${{ matrix.php-version }}-

            - name: Install dependencies
              run: composer install --prefer-dist --no-progress --ignore-platform-req=php+

            - name: phpcs
              run: php vendor/bin/phpcs

            - name: phpstan
              run: php vendor/bin/phpstan analyze

    test:
        runs-on: ubuntu-latest
        name: "Test | PHP ${{ matrix.php-version }} | Laravel ${{ matrix.laravel-version }}"
        strategy:
            fail-fast: false
            matrix:
                php-version:
                    - "8.1"
                    - "8.2"
                    - "8.3"
                    - "8.4"
                    - "8.5"
                laravel-version:
                    - "10"
                    - "11"
                    - "12"
                    - "13"
                exclude:
                    # Laravel 11 and 12 require PHP ^8.2
                    - php-version: "8.1"
                      laravel-version: "11"
                    - php-version: "8.1"
                      laravel-version: "12"
                    # Laravel 13 requires PHP ^8.3
                    - php-version: "8.1"
                      laravel-version: "13"
                    - php-version: "8.2"
                      laravel-version: "13"
        steps:
            - uses: actions/checkout@v7

            - name: Install PHP
              uses: shivammathur/setup-php@v2
              with:
                  coverage: "none"
                  php-version: "${{ matrix.php-version }}"
                  tools: composer:v2

            - name: Cache Composer packages
              id: composer-cache
              uses: actions/cache@v6
              with:
                  path: vendor
                  key: ${{ runner.os }}-php-${{ matrix.php-version }}-laravel-${{ matrix.laravel-version }}-${{ hashFiles('**/composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-php-${{ matrix.php-version }}-laravel-${{ matrix.laravel-version }}-

            - name: Install dependencies
              run: composer install --prefer-dist --no-progress --ignore-platform-req=php+

            - name: Install laravel
              run: composer require --prefer-dist --no-progress --with-all-dependencies --dev --ignore-platform-req=php+ --no-blocking laravel/framework:^${{ matrix.laravel-version }}

            - name: Run test suite
              run: php vendor/bin/phpunit

    coverage:
        runs-on: ubuntu-latest
        name: "Coverage | PHP ${{ matrix.php-version }}"
        strategy:
            matrix:
                php-version:
                    - "8.5"
        steps:
            - uses: actions/checkout@v7

            - name: Install PHP
              uses: shivammathur/setup-php@v2
              with:
                  coverage: pcov
                  php-version: "${{ matrix.php-version }}"
                  tools: composer:v2

            - name: Cache Composer packages
              id: composer-cache
              uses: actions/cache@v6
              with:
                  path: vendor
                  key: ${{ runner.os }}-php-${{ matrix.php-version }}-${{ hashFiles('**/composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-php-${{ matrix.php-version }}-

            - name: Install dependencies
              run: composer install --prefer-dist --no-progress

            - name: Run test suite with coverage
              run: php vendor/bin/phpunit --coverage-text

            # Code Climate disabled its coverage API in July 2025. Keep this
            # disabled until coverage reporting is migrated to Qlty.
            # - name: Upload code coverage
            #   uses: paambaati/codeclimate-action@v9.0.0
            #   env:
            #       CC_TEST_REPORTER_ID: 3f8f6d064fc0b063230c71511f07aec326a2eb84f3c5653161b5f087aae315f9
            #   with:
            #       coverageCommand: "true"
            #       coverageLocations: |
            #           clover.xml:clover

    nix:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: cachix/install-nix-action@v31
              with:
                  nix_path: nixpkgs=channel:nixos-26.05

#            - run: nix build -L

            - run: nix flake check -L
