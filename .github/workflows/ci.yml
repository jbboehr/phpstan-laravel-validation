name: ci

on:
    push:
        branches:
            - master
            - develop
            - ci
    pull_request:
        branches:
            - master

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    baseline:
        name: Conventional PHP baseline | PHP 8.5
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Install PHP
              uses: shivammathur/setup-php@v2
              with:
                  coverage: "none"
                  php-version: "8.5"
                  tools: composer:v2

            - name: Cache Composer packages
              uses: actions/cache@v6
              with:
                  path: vendor
                  key: ${{ runner.os }}-php-8.5-${{ hashFiles('composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-php-8.5-

            - name: Install dependencies
              run: composer install --prefer-dist --no-interaction --no-progress --ignore-platform-req=php+

            - name: Validate Composer files
              run: composer validate --strict

            - name: PHPUnit
              run: php vendor/bin/phpunit --no-coverage --log-junit "$RUNNER_TEMP/phpunit-junit.xml"

            - name: Upload PHPUnit results
              if: ${{ always() }}
              uses: actions/upload-artifact@v7
              with:
                  name: conventional-phpunit-results
                  path: ${{ runner.temp }}/phpunit-junit.xml
                  if-no-files-found: warn
                  retention-days: 14

            - name: PHPStan
              run: php vendor/bin/phpstan analyse --no-progress

            - name: php-cs-fixer
              run: php vendor/bin/php-cs-fixer fix --config=.php-cs-fixer.dist.php --dry-run --diff

    nix-matrix:
        name: Generate exhaustive Nix matrix
        runs-on: ubuntu-latest
        outputs:
            matrix: ${{ steps.matrix.outputs.matrix }}
        steps:
            - uses: actions/checkout@v7

            - uses: cachix/install-nix-action@v31

            - id: matrix
              name: Evaluate nix-github-actions matrix
              run: |
                  set -Eeu
                  matrix="$(nix eval --json '.#legacyPackages.x86_64-linux.githubActions.matrix')"
                  echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

    nix-dependencies:
        name: Prebuild Nix Composer dependencies
        runs-on: ubuntu-latest
        outputs:
            cache-key: ${{ steps.cache-key.outputs.cache-key }}
        steps:
            - uses: actions/checkout@v7

            - uses: cachix/install-nix-action@v31

            - name: Use the nix-phps binary cache
              uses: cachix/cachix-action@v17
              with:
                  name: fossar
                  skipPush: true

            - id: cache-key
              name: Identify the Composer dependency closure
              run: |
                  drv_path="$(nix eval --raw '.#packages.x86_64-linux.ci-dependencies.drvPath')"
                  drv_name="${drv_path##*/}"
                  echo "cache-key=nix-ci-dependencies-${RUNNER_OS}-${drv_name%.drv}" >> "$GITHUB_OUTPUT"

            - name: Restore or prepare the Composer dependency cache
              uses: nix-community/cache-nix-action@v7
              with:
                  primary-key: ${{ steps.cache-key.outputs.cache-key }}
                  restore-prefixes-first-match: nix-ci-dependencies-${{ runner.os }}-
                  gc-max-store-size-linux: 4G

            - name: Build every Composer dependency closure
              shell: bash
              run: |
                  bash scripts/nix-build-with-vendor-hash-report.bash \
                      "$RUNNER_TEMP/nix-dependencies-build.log" \
                      nix build -L --keep-going \
                      --out-link "$RUNNER_TEMP/ci-dependencies" \
                      .#ci-dependencies

    nix-build:
        name: Nix | ${{ matrix.name }}
        needs:
            - nix-matrix
            - nix-dependencies
        runs-on: ${{ matrix.os }}
        timeout-minutes: 90
        strategy:
            fail-fast: false
            max-parallel: 12
            matrix: ${{ fromJSON(needs.nix-matrix.outputs.matrix) }}
        steps:
            - uses: actions/checkout@v7

            - uses: cachix/install-nix-action@v31

            - name: Restore prebuilt Composer dependencies
              uses: nix-community/cache-nix-action@v7
              with:
                  primary-key: ${{ needs.nix-dependencies.outputs.cache-key }}
                  fail-on: primary-key.not-restored
                  save: false

            - name: Use the nix-phps binary cache
              uses: cachix/cachix-action@v17
              with:
                  name: fossar
                  skipPush: true

            - name: Build ${{ matrix.attr }}
              shell: bash
              env:
                  NIX_INSTALLABLE: .#${{ matrix.attr }}
              run: |
                  bash scripts/nix-build-with-vendor-hash-report.bash \
                      "$RUNNER_TEMP/nix-build.log" \
                      nix build -L --keep-going --max-jobs 4 \
                      --out-link "$RUNNER_TEMP/nix-result" \
                      "$NIX_INSTALLABLE"

            - name: Prepare Infection shard report
              if: startsWith(matrix.name, 'mutation-')
              run: cp -LR "$RUNNER_TEMP/nix-result/reports" "$RUNNER_TEMP/infection-report"

            - name: Upload Infection shard report
              if: startsWith(matrix.name, 'mutation-')
              uses: actions/upload-artifact@v7
              with:
                  name: ${{ matrix.name }}
                  path: ${{ runner.temp }}/infection-report
                  if-no-files-found: error
                  retention-days: 7

    mutation-report:
        name: Nix | mutation aggregate
        if: ${{ !cancelled() }}
        needs: nix-build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: cachix/install-nix-action@v31

            - name: Download Infection shard reports
              uses: actions/download-artifact@v8
              with:
                  pattern: mutation-*
                  path: ${{ runner.temp }}/infection-reports

            - name: Enforce aggregate mutation thresholds
              shell: bash
              run: |
                  set -Eeu -o pipefail

                  reports=()
                  while IFS= read -r shard; do
                      report="$RUNNER_TEMP/infection-reports/mutation-$shard/infection-summary.json"
                      if [ ! -f "$report" ]; then
                          echo "Missing Infection report for shard: $shard" >&2
                          exit 1
                      fi
                      reports+=("$shard=$report")
                  done < <(jq -r 'keys[]' .github/infection-shards.json)

                  nix run -L .#mutation-report -- "${reports[@]}" \
                      | tee "$RUNNER_TEMP/infection-summary.json"

            - name: Upload aggregate mutation report
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@v7
              with:
                  name: mutation-summary
                  path: ${{ runner.temp }}/infection-summary.json
                  if-no-files-found: warn
                  retention-days: 7
