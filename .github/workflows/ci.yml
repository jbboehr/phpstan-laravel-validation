name: ci

on:
    push:
        branches:
            - master
            - develop
            - ci
    pull_request:
        branches:
            - master

permissions:
    contents: read

jobs:
    baseline:
        name: Conventional PHP baseline | PHP 8.5
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Install PHP
              uses: shivammathur/setup-php@v2
              with:
                  coverage: "none"
                  php-version: "8.5"
                  tools: composer:v2

            - name: Cache Composer packages
              uses: actions/cache@v6
              with:
                  path: vendor
                  key: ${{ runner.os }}-php-8.5-${{ hashFiles('composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-php-8.5-

            - name: Install dependencies
              run: composer install --prefer-dist --no-interaction --no-progress --ignore-platform-req=php+

            - name: Validate Composer files
              run: composer validate --strict

            - name: PHPUnit
              run: php vendor/bin/phpunit --no-coverage

            - name: PHPStan
              run: php vendor/bin/phpstan analyse --no-progress

            - name: php-cs-fixer
              run: php vendor/bin/php-cs-fixer fix --config=.php-cs-fixer.dist.php --dry-run --diff

    nix-matrix:
        name: Generate exhaustive Nix matrix
        runs-on: ubuntu-latest
        outputs:
            matrix: ${{ steps.matrix.outputs.matrix }}
        steps:
            - uses: actions/checkout@v7

            - uses: cachix/install-nix-action@v31

            - id: matrix
              name: Evaluate nix-github-actions matrix
              run: |
                  set -Eeu
                  matrix="$(nix eval --json '.#legacyPackages.x86_64-linux.githubActions.matrix')"
                  echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

    nix-build:
        name: Nix | ${{ matrix.name }}
        needs: nix-matrix
        runs-on: ${{ matrix.os }}
        timeout-minutes: 90
        strategy:
            fail-fast: false
            max-parallel: 12
            matrix: ${{ fromJSON(needs.nix-matrix.outputs.matrix) }}
        steps:
            - uses: actions/checkout@v7

            - uses: cachix/install-nix-action@v31

            - name: Use the nix-phps binary cache
              uses: cachix/cachix-action@v17
              with:
                  name: fossar
                  skipPush: true

            - name: Build ${{ matrix.attr }}
              shell: bash
              env:
                  NIX_INSTALLABLE: .#${{ matrix.attr }}
                  NIX_MATRIX_NAME: ${{ matrix.name }}
              run: |
                  max_jobs=4
                  if [ "$NIX_MATRIX_NAME" = "mutation" ]; then
                      # Each Infection shard already uses four workers. Build
                      # the shards serially to avoid running sixteen workers
                      # on a four-core GitHub-hosted runner.
                      max_jobs=1
                  fi

                  set +e
                  nix build -L --keep-going --max-jobs "$max_jobs" "$NIX_INSTALLABLE" 2>&1 | tee "$RUNNER_TEMP/nix-build.log"
                  nix_status=${PIPESTATUS[0]}
                  set -e

                  if [ "$nix_status" -ne 0 ]; then
                      mapfile -t replacement_hashes < <(
                          sed -nE 's/^[[:space:]]*got:[[:space:]]+(sha256-[^[:space:]]+).*$/\1/p' \
                              "$RUNNER_TEMP/nix-build.log" | sort -u
                      )

                      if [ "${#replacement_hashes[@]}" -gt 0 ]; then
                          {
                              echo "## Nix Composer vendor hash update"
                              echo
                              echo "Nix reported the following authoritative replacement hash values:"
                              echo
                              for replacement_hash in "${replacement_hashes[@]}"; do
                                  echo "- \`$replacement_hash\`"
                              done
                              echo
                              echo "Update the matching entry in \`nix/vendor-hashes.nix\`, then rerun the failed target."
                          } | tee -a "$GITHUB_STEP_SUMMARY"
                      fi
                  fi

                  exit "$nix_status"
